[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"

# Sequence email post-achat - toutes les heures
[functions."email-sequence"]
  schedule = "0 * * * *"

[[plugins]]
  package = "@netlify/plugin-lighthouse"
  [plugins.inputs]
    fail_deploy_on_score_thresholds = "false"